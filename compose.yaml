# Local single-operator hosted runtime worker.
#
# This is a development baseline, not a multi-tenant isolation boundary. The container keeps a
# persistent workspace volume and shared Pi agent volume, connects back to a local API, and needs
# outbound network access for Git fetches and model providers. Its trusted root supervisor retains
# dispatcher authority while each untrusted Pi process runs under a distinct workspace UID.
services:
  hosted-runner:
    build:
      context: .
      dockerfile: packages/runner/Dockerfile
    restart: unless-stopped
    environment:
      PI_CLOUD_HOSTED_DISPATCHER_URL: "${PI_CLOUD_HOSTED_CONTAINER_DISPATCHER_URL:-http://host.docker.internal:3000}"
      PI_CLOUD_HOSTED_DISPATCHER_TOKEN: "${PI_CLOUD_HOSTED_DISPATCHER_TOKEN:-replace-with-at-least-32-random-characters}"
      PI_CLOUD_RUNNER_ID: "${PI_CLOUD_RUNNER_ID:-hosted-runner-local-1}"
      PI_CLOUD_HOSTED_WORKSPACE_ROOTS: /var/lib/pi-cloud/workspaces
      PI_CLOUD_HOSTED_SESSION_ROOTS: /var/lib/pi-cloud/workspaces
      PI_CLOUD_HOSTED_AGENT_ROOTS: /var/lib/pi-cloud/agent
      PI_CLOUD_HOSTED_PROCESS_ISOLATION: workspace_uid
      PI_CLOUD_PI_EXECUTABLE: "${PI_CLOUD_PI_EXECUTABLE:-pi}"
      HOME: /tmp/pi-cloud-runner-home
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - pi-cloud-workspaces:/var/lib/pi-cloud/workspaces
      - pi-cloud-agent:/var/lib/pi-cloud/agent:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 20s

volumes:
  pi-cloud-workspaces:
  pi-cloud-agent:
